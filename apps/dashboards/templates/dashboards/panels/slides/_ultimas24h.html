{% comment %}
Quedas por bucket nas últimas horas — a forma do problema no tempo.

Barra alta é simultaneidade, que é o sinal que separa massiva de queda avulsa. A
parte verde já voltou: numa TV, ver o verde crescer durante o reparo é metade da
razão de a tela existir.
{% endcomment %}
<div id="painel-timeline" class="h-full w-full"></div>
<script>
(function () {
  var node = document.getElementById("painel-timeline-data");
  var el = document.getElementById("painel-timeline");
  if (!node || !el || !node.textContent) { return; }
  function desenhar() {
    try {
      var raw = JSON.parse(node.textContent);
      var parsed = (typeof raw === "string") ? JSON.parse(raw) : raw;
      var layout = parsed.layout || {};
      // O tema do gráfico é refeito aqui, e não no servidor: o mesmo gráfico
      // serve a aba (fundo claro) e a TV (fundo escuro), e duplicar a figura no
      // backend faria as duas divergirem no dia em que uma fosse corrigida.
      layout.paper_bgcolor = "rgba(0,0,0,0)";
      layout.plot_bgcolor = "rgba(0,0,0,0)";
      layout.font = { color: "#cbd5e1", size: 16 };
      layout.margin = { l: 50, r: 20, t: 10, b: 40 };
      layout.showlegend = false;
      Plotly.newPlot(el, parsed.data || [], layout, { displayModeBar: false, responsive: true });
    } catch (e) { /* slide sem gráfico é melhor que painel quebrado */ }
  }
  desenhar();
  // Redesenha ao entrar no slide: o Plotly mede errado quando o container está
  // escondido, e o gráfico sairia espremido num canto.
  window.addEventListener("painel:slide", function (ev) {
    if (ev.detail.key === "ultimas24h") { Plotly.Plots.resize(el); }
  });
})();
</script>
